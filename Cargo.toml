[package]
name = "berg-controller"
version = "1.1.4"
edition = "2021"
default-run = "berg-controller"

[[bin]]
name = "berg-controller"
path = "src/main.rs"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"

[lib]
name = "berg_operator"
path = "src/lib.rs"

[profile.release]
strip = true
lto = true

[dependencies]
# Kubernetes client and runtime
kube = { version = "4.2", features = ["runtime", "derive", "client", "ws"] }
k8s-openapi = { version = "0.28", features = ["v1_34", "schemars"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "1"

# Async runtime
tokio = { version = "1.53", features = ["full"] }
futures = "0.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.24", features = ["v4", "serde"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "ansi",
    "json",
] }

# Random for entropy
rand = "0.9"
